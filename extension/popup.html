<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>XPath Auto Clicker</h1>
  <div id="host" class="host"></div>

  <label id="campoXpath" hidden>XPath del elemento a clickear
    <textarea id="xpath" rows="3" spellcheck="false"
      placeholder="//div[@class='caido']/button"></textarea>
  </label>

  <p class="nota">Click cada 1–3 s al azar, distinto cada vez.</p>

  <label>Si hay varias coincidencias
    <select id="modo">
      <option value="todos">Clickear todas</option>
      <option value="primero">Solo la primera</option>
    </select>
  </label>
  <label class="check"><input id="soloVisibles" type="checkbox" checked> Solo elementos visibles</label>
  <label class="check"><input id="unaVez" type="checkbox"> Un solo click por Digimon caído</label>

  <div class="botones">
    <button id="probar" class="sec">Probar</button>
    <button id="toggle">Iniciar</button>
  </div>
  <button id="preset" class="sec" hidden style="width:100%;margin-top:6px">Restaurar config de DigiIdle</button>
  <div id="msg" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
